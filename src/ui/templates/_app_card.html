<article class="kanban-card" data-app-idx="{{ row._idx }}" id="app-card-{{ row._idx }}">
  <div class="kanban-card-hover-actions">
    <button type="button"
            class="hover-action"
            hx-get="/applications/{{ row._idx }}/edit"
            hx-target="#app-card-{{ row._idx }}"
            hx-swap="outerHTML"
            title="edit"
            aria-label="edit">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
    </button>
    <button type="button"
            class="hover-action danger"
            hx-delete="/applications/{{ row._idx }}"
            hx-target="#kanban-grid"
            hx-swap="outerHTML"
            hx-confirm="Delete this application?"
            title="delete"
            aria-label="delete">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>

  <h3 class="kanban-card-company">{{ row.company }}</h3>
  <p class="kanban-card-role" title="{{ row.role }}">{{ row.role }}</p>

  <div class="kanban-card-meta">
    <span class="mono">{{ row.status_updated_at or row.date }}</span>
    {% if row.fit_score %}<span class="kanban-card-fit">{{ row.fit_score }}/5</span>{% endif %}
    {% if row.posting_url %}
      <a href="{{ row.posting_url }}" target="_blank" rel="noopener" class="kanban-card-link" title="open posting" onclick="event.stopPropagation()">↗</a>
    {% endif %}
  </div>
</article>
