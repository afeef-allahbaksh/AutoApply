<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · AutoApply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --canvas: #fafaf7;
      --canvas-raised: #ffffff;
      --canvas-sunken: #f4f2ec;

      --ink: #1a1a1a;
      --ink-strong: #000000;
      --ink-muted: #6b6863;
      --ink-soft: #9a9690;

      --rule: #e8e6df;
      --rule-bold: #c9c5bb;

      --accent: #2d4a2b;
      --accent-hover: #1f3a1d;
      --accent-soft: #4a6b48;
      --accent-tint: #ebf0ea;

      --status-success: #2d4a2b;
      --status-success-bg: #ebf0ea;
      --status-info: #2c3e50;
      --status-info-bg: #e9edf1;
      --status-warning: #7a5808;
      --status-warning-bg: #f4ecd8;
      --status-danger: #7a1a1a;
      --status-danger-bg: #f1e3e3;

      --radius-sm: 3px;
      --radius-md: 6px;
      --shadow-subtle: 0 1px 2px rgba(26, 26, 26, 0.04);
      --shadow-raised: 0 4px 16px -8px rgba(26, 26, 26, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: -0.005em;
      font-feature-settings: 'tnum', 'ss01';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--ink);
      background: var(--canvas);
      min-height: 100vh;
    }

    h1, h2, h3, .display {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.02em;
      font-feature-settings: 'tnum';
      color: var(--ink-strong);
    }

    a { color: inherit; text-decoration: none; }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    aside.sidebar {
      padding: 2.25rem 1.5rem 2rem 2rem;
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      background: var(--canvas);
    }

    .wordmark {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: 19px;
      letter-spacing: -0.02em;
      color: var(--ink-strong);
    }
    .wordmark .accent { color: var(--accent); }

    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-muted);
    }

    .profile-row {
      display: flex; flex-direction: column; gap: 0.375rem;
    }
    .profile-select {
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule);
      padding: 0.375rem 0.125rem;
      width: 100%;
      appearance: none;
      cursor: pointer;
    }
    .profile-select:focus {
      outline: none;
      border-bottom-color: var(--ink);
    }

    nav.primary {
      display: flex; flex-direction: column; gap: 0.0625rem;
      margin-top: -0.5rem;
    }
    nav.primary a.nav-item {
      display: flex; align-items: center; gap: 0.625rem;
      padding: 0.4375rem 0.75rem 0.4375rem 0.875rem;
      margin-left: -0.875rem;
      color: var(--ink-muted);
      font-size: 13.5px;
      font-weight: 400;
      border-left: 2px solid transparent;
      transition: color 120ms ease, border-color 120ms ease;
    }
    nav.primary a.nav-item:hover { color: var(--ink); }
    nav.primary a.nav-item.active {
      color: var(--ink-strong);
      font-weight: 500;
      border-left-color: var(--accent);
    }
    nav.primary a.nav-item .v2-tag {
      margin-left: auto;
      font-size: 9px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .sidebar-foot {
      margin-top: auto;
      font-size: 11px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    main {
      padding: 3rem 3.5rem 4rem 3.5rem;
      max-width: 1320px;
      width: 100%;
    }

    main > header.page-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 1.5rem;
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--rule);
    }
    main > header.page-head .page-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--ink-muted);
      margin-bottom: 0.5rem;
    }
    main > header.page-head h1 {
      font-size: 34px;
      line-height: 1.1;
      margin: 0;
    }

    /* Cards (legacy class .glass-card kept; restyled) */
    .glass-card,
    .card {
      background: var(--canvas-raised);
      border: 1px solid var(--rule);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
    }
    .glass-card.flush,
    .card.flush { padding: 0; }

    /* Buttons */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--ink-strong);
      color: #fff;
      border: 1px solid var(--ink-strong);
      border-radius: var(--radius-sm);
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.005em;
      cursor: pointer;
      transition: background 120ms ease;
    }
    .btn-primary:hover { background: var(--accent); border-color: var(--accent); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--rule-bold);
      border-radius: var(--radius-sm);
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease;
    }
    .btn-ghost:hover { border-color: var(--ink); color: var(--ink-strong); }

    /* Inputs */
    .pill-input,
    .pill-select,
    select.pill-select,
    input.pill-input,
    textarea.pill-input {
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--canvas-raised);
      border: 1px solid var(--rule-bold);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      transition: border-color 120ms ease;
    }
    .pill-input:focus,
    .pill-select:focus,
    select.pill-select:focus,
    input.pill-input:focus,
    textarea.pill-input:focus {
      outline: none;
      border-color: var(--ink);
      background: var(--canvas-raised);
    }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      font-family: 'Inter', sans-serif;
      border: 1px solid transparent;
    }
    .badge-success { background: var(--status-success-bg); color: var(--status-success); }
    .badge-info    { background: var(--status-info-bg);    color: var(--status-info); }
    .badge-warning { background: var(--status-warning-bg); color: var(--status-warning); }
    .badge-danger  { background: var(--status-danger-bg);  color: var(--status-danger); }
    .badge-neutral { background: transparent; color: var(--ink-muted); border-color: var(--rule); }

    /* Stat numbers */
    .stat-number {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 44px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.025em;
      color: var(--ink-strong);
      font-feature-settings: 'tnum';
    }
    .stat-number .unit {
      font-size: 18px;
      color: var(--ink-muted);
      margin-left: 0.125rem;
    }

    /* Tables */
    table.app-table { border-collapse: separate; border-spacing: 0; width: 100%; }
    table.app-table th {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      text-align: left;
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--rule);
      background: var(--canvas-sunken);
    }
    table.app-table th a { color: inherit; }
    table.app-table th a:hover { color: var(--ink-strong); }
    table.app-table td {
      padding: 0.9375rem 1.25rem;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      vertical-align: middle;
      font-size: 13.5px;
    }
    table.app-table tbody tr:last-child td { border-bottom: none; }
    table.app-table tbody tr:hover td { background: var(--canvas-sunken); }

    /* Inline links inside tables */
    table.app-table a.link {
      color: var(--accent);
      border-bottom: 1px solid var(--rule-bold);
    }
    table.app-table a.link:hover { color: var(--accent-hover); border-bottom-color: var(--accent); }

    /* Spinner */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-flex; }
    .htmx-request.htmx-indicator { display: inline-flex; }
    .spinner {
      width: 12px; height: 12px;
      border: 1.5px solid var(--rule-bold);
      border-top-color: var(--ink);
      border-radius: 9999px;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Editorial divider */
    .rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }
    .rule-bold { border: 0; border-top: 1px solid var(--rule-bold); margin: 0; }

    /* Mono inline */
    .mono {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* Stat grid */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      background: var(--canvas-raised);
    }
    .stat-cell {
      padding: 1.5rem 1.5rem 1.625rem;
      border-right: 1px solid var(--rule);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-cell .label {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      margin-bottom: 0.5rem;
    }
    .stat-cell .helper {
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 0.375rem;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="wordmark">AutoApply<span class="accent">.</span></div>

      <div class="profile-row">
        <span class="section-label">Profile</span>
        <form method="post" action="/profile">
          <select name="name" class="profile-select" onchange="this.form.submit()">
            {% for p in profiles %}
              <option value="{{ p }}" {% if p == active_profile_name %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </form>
      </div>

      <nav class="primary">
        <a href="/" class="nav-item {% if current_path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/jobs" class="nav-item {% if current_path == '/jobs' %}active{% endif %}">Jobs</a>
        <a href="/applications" class="nav-item {% if current_path == '/applications' %}active{% endif %}">Applications</a>
        <a href="/companies" class="nav-item {% if current_path == '/companies' %}active{% endif %}">Companies</a>
        <a href="/cold-email" class="nav-item {% if current_path == '/cold-email' %}active{% endif %}">
          Cold email <span class="v2-tag">v2</span>
        </a>
        <a href="/settings" class="nav-item {% if current_path == '/settings' %}active{% endif %}">Settings</a>
      </nav>

      <div class="sidebar-foot">
        Bound to 127.0.0.1<br>Single user, no auth.
      </div>
    </aside>

    <main>
      <header class="page-head">
        <div>
          <div class="page-eyebrow">{{ active_profile_name or "no profile" }}</div>
          <h1>{{ page_title }}</h1>
        </div>
        <div>{% block header_actions %}{% endblock %}</div>
      </header>

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
