{% extends "base.html" %}
{% block header_actions %}
<form hx-post="/jobs/refresh"
      hx-target="#jobs-table"
      hx-swap="innerHTML"
      hx-include="#jobs-filters"
      style="display: inline-flex; gap: 0.5rem; align-items: center;">
  <button type="submit" class="btn-primary" hx-disabled-elt="this">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
    Refresh jobs
  </button>
  <span class="htmx-indicator spinner"></span>
</form>
{% endblock %}

{% block content %}
<div class="glass-card" style="padding: 1rem 1.25rem; margin-bottom: 1rem;">
  <form id="jobs-filters" method="get" action="/jobs" style="display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap;">
    <div>
      <div class="section-label" style="margin-bottom: 0.25rem;">Min fit</div>
      <select class="pill-select" name="min_fit">
        {% for v in [0, 1, 2, 3, 4, 5] %}
          <option value="{{ v }}" {% if min_fit == v %}selected{% endif %}>{{ v }}+</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <div class="section-label" style="margin-bottom: 0.25rem;">Company</div>
      <input class="pill-input" name="company" value="{{ company }}" placeholder="substring">
    </div>
    <div>
      <div class="section-label" style="margin-bottom: 0.25rem;">ATS</div>
      <select class="pill-select" name="ats">
        <option value="" {% if not ats %}selected{% endif %}>any</option>
        <option value="greenhouse" {% if ats == 'greenhouse' %}selected{% endif %}>greenhouse</option>
        <option value="lever" {% if ats == 'lever' %}selected{% endif %}>lever</option>
      </select>
    </div>
    <button type="submit" class="btn-ghost">Filter</button>
  </form>
</div>

<div id="jobs-table" class="glass-card" style="padding: 0; overflow: hidden;">
  {% include "_jobs_table.html" %}
</div>
{% endblock %}
