{% extends "base.html" %}
{% block header_actions %}
<form hx-post="/companies/discover"
      hx-target="#companies-content"
      hx-swap="outerHTML"
      hx-indicator="#discover-spinner"
      style="display: inline-flex; gap: 0.625rem; align-items: center;">
  <button type="submit" class="btn-primary" hx-disabled-elt="this"
          title="Validate the curated seed list against Greenhouse and Lever; new companies are merged into companies.json.">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Discover companies
  </button>
  <span id="discover-spinner" class="htmx-indicator spinner" style="margin-left: 0.25rem;"></span>
</form>
{% endblock %}
{% block content %}
{% include "_companies_main.html" %}
{% endblock %}
